<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みんカレポータル | Shimokita College</title>
<meta name="description" content="Shimokita College 全体会議の議案を、提案から議論・決議まで居住者全員で共有するポータル">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
<style>
  /*
   * サイト制作ルールブック準拠。配色は白地＋淡い面（MD3の塗りカード風）。キーカラーは DADS Blue 700、
   * セマンティックカラーは @digital-go-jp/design-tokens 2.0.1 の値。
   */
  :root {
    --bg: #ffffff;            /* White */
    --bg-sub: #ffffff;        /* Solid Gray 50 */
    --surface: #f3f6fd;
    --text: #1b1b1f;          /* Solid Gray 900 */
    --text-2: #45474f;        /* Solid Gray 700  7.5:1 */
    --text-3: #5c5f66;        /* Solid Gray 600  5.1:1 on Gray 50 */
    --border: #8e919a;        /* Solid Gray 536  操作部品の枠 */
    --divider: #e1e4ec;       /* Solid Gray 420  区切り線 3:1 */
    --primary: #264af4;       /* Blue 900  キーカラー プライマリー */
    --primary-hover: #0031d8; /* Blue 1000 */
    --primary-active: #0017c1;/* Blue 1200 */
    --on-primary: #ffffff;
    --primary-container: #d9e6ff;   /* Blue 50 */
    --on-primary-container: #0031d8;
    --secondary: #3460fb;     /* Blue 600  セカンダリー（非テキスト・強調線） */
    --success: #197a4b; --success-line: #259d63; --success-bg: #e6f5ec;  /* Green 800 / 600 / 50 */
    --error: #ce0000;   --error-line: #ec0000;   --error-bg: #fdeeee;    /* Red 900 / 800 / 50 */
    --focus-a: #000000; --focus-b: #ffd43d;  /* フォーカス: 黒＋Yellow 300 の二重 */
    --scrim: rgba(0, 0, 0, .32);

    --font: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', Meiryo, sans-serif;
    --fs-s: .875rem; --fs-m: 1rem; --fs-l: 1.125rem; --fs-xl: 1.25rem; --fs-h2: 1.5rem; --fs-h1: 1.75rem;
    --sp-1: 4px; --sp-2: 8px; --sp-3: 16px; --sp-4: 24px; --sp-5: 32px; --sp-6: 48px;
    --r-s: 8px; --r-m: 12px; --r-l: 16px; --r-xl: 28px; --r-full: 9999px;
    --ease: cubic-bezier(.2, 0, 0, 1);
    --ease-in: cubic-bezier(0, 0, 0, 1);
    --list-w: 400px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font); font-size: var(--fs-m); line-height: 1.7; letter-spacing: .02em;
    color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; background: none; border: none; }
  a { color: var(--primary); text-underline-offset: 3px; }
  a:hover { color: var(--primary-hover); text-decoration-thickness: 2px; }
  ul { list-style: none; }
  :focus-visible { outline: 2px solid var(--focus-a); outline-offset: 2px; box-shadow: 0 0 0 4px var(--focus-b); }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .ic { width: 1.25em; height: 1.25em; flex-shrink: 0; }
  .skip { position: absolute; left: var(--sp-3); top: -100px; z-index: 500; background: var(--primary); color: var(--on-primary); padding: var(--sp-2) var(--sp-3); border-radius: var(--r-s); }
  .skip:focus { top: var(--sp-2); color: var(--on-primary); }

  /* ─── ボタン（塗り=プライマリー / アウトライン=セカンダリー / テキスト=ターシャリー） ─── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
    min-height: 48px; padding: 0 var(--sp-4); border-radius: var(--r-s);
    font-size: var(--fs-m); font-weight: 700; line-height: 1.3; white-space: nowrap; text-decoration: none;
    border: 1px solid var(--primary); background: var(--primary); color: var(--on-primary);
    transition: background-color 150ms var(--ease), color 150ms var(--ease), border-color 150ms var(--ease);
  }
  .btn:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: var(--on-primary); text-decoration: none; }
  .btn:active { background: var(--primary-active); }
  .btn.outline { background: var(--surface); color: var(--primary); }
  .btn.outline:hover { background: var(--primary-container); color: var(--on-primary-container); }
  .btn.sm { min-height: 40px; padding: 0 var(--sp-3); font-size: var(--fs-s); }
  .btn[aria-disabled="true"] { cursor: progress; }
  .btn-text {
    display: inline-flex; align-items: center; gap: var(--sp-1); min-height: 44px; padding: 0 var(--sp-1);
    font-size: var(--fs-s); color: var(--primary); text-decoration: underline; text-underline-offset: 3px;
  }
  .btn-text:hover { color: var(--primary-hover); text-decoration-thickness: 2px; }
  .btn-text.danger { color: var(--error); }

  /* ─── アプリバー ─── */
  .appbar { background: var(--surface); border-bottom: 1px solid var(--divider); position: sticky; top: 0; z-index: 100; }
  .appbar-in { max-width: 1280px; margin: 0 auto; padding: 0 var(--sp-4); min-height: 64px; display: flex; align-items: center; gap: var(--sp-3); }
  .brand { display: flex; align-items: center; gap: 12px; color: var(--text); text-decoration: none; margin-right: auto; }
  .brand:hover { color: var(--text); }
  .brand-mark { width: 36px; height: 36px; }
  .brand-mark .bub { fill: var(--primary-container); stroke: var(--primary); stroke-width: 2.4; stroke-linejoin: round; }
  .brand-mark .fig { fill: var(--primary); }
  .brand-name { font-size: var(--fs-xl); font-weight: 700; line-height: 1.2; letter-spacing: .01em; }
  .brand-sub { display: block; font-size: var(--fs-s); font-weight: 400; color: var(--text-3); }

  /* ─── 表示切替（水平メニュー） ─── */
  .views { background: var(--surface); border-bottom: 1px solid var(--divider); }
  .views ul { max-width: 1280px; margin: 0 auto; padding: 0 var(--sp-4); display: flex; gap: var(--sp-2); overflow-x: auto; }
  .views a {
    display: inline-flex; align-items: center; gap: var(--sp-2); min-height: 52px; padding: 0 var(--sp-3);
    color: var(--text-2); text-decoration: none; white-space: nowrap; border-bottom: 3px solid transparent; margin-bottom: -1px;
    transition: color 150ms var(--ease), border-color 150ms var(--ease);
  }
  .views a:hover { color: var(--text); background: var(--bg-sub); }
  .views a[aria-current="page"] { color: var(--primary); font-weight: 700; border-color: var(--primary); }
  .count-badge {
    min-width: 28px; padding: 0 var(--sp-2); border-radius: var(--r-full); text-align: center;
    font-size: var(--fs-s); font-weight: 700; line-height: 24px; font-variant-numeric: tabular-nums;
    background: var(--bg-sub); color: var(--text-2); border: 1px solid var(--divider);
  }
  .views a[aria-current="page"] .count-badge { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }

  /* ─── 2ペイン ─── */
  .layout { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: var(--list-w) 1fr; min-height: calc(100vh - 118px); }
  .list-pane { background: var(--bg-sub); border-right: 1px solid var(--divider); padding: var(--sp-4) var(--sp-4) var(--sp-6); }
  .detail-pane { padding: var(--sp-5) var(--sp-5) 96px; min-width: 0; }
  .pane-head h1 { font-size: var(--fs-h1); font-weight: 700; line-height: 1.4; }
  .pane-desc { color: var(--text-2); margin-top: var(--sp-1); font-size: var(--fs-s); }

  /* 検索 */
  .search { margin-top: var(--sp-3); }
  .search label { display: block; font-size: var(--fs-s); font-weight: 700; margin-bottom: var(--sp-1); }
  .search-box { position: relative; }
  .search-box > .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
  .search-box .field { padding-left: 44px; padding-right: 48px; }
  .search-box .field::-webkit-search-cancel-button { display: none; }
  .search-clear { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; display: grid; place-items: center; color: var(--text-2); border-radius: var(--r-s); }
  .search-clear:hover { background: var(--bg-sub); color: var(--text); }
  .search-count { font-size: var(--fs-s); color: var(--text-3); margin-top: var(--sp-1); min-height: 1.7em; }

  /* 議案リスト */
  .items { display: grid; gap: var(--sp-2); margin-top: var(--sp-4); }
  .item {
    display: block; padding: var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-m);
    background: var(--surface); color: var(--text); text-decoration: none;
    transition: background-color 150ms var(--ease), border-color 150ms var(--ease);
  }
  .item:hover { color: var(--text); background: var(--primary-container); }
  .item[aria-current="true"] { border: 2px solid var(--primary); padding: 15px; background: var(--primary-container); }
  .item-title { display: block; margin-top: var(--sp-2); font-size: var(--fs-l); font-weight: 700; line-height: 1.5; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; color: var(--text); }
  .item:hover .item-title { text-decoration-thickness: 2px; }
  .item-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1) var(--sp-3); margin-top: var(--sp-2); font-size: var(--fs-s); color: var(--text-2); }
  .item-meta span { display: inline-flex; align-items: center; gap: var(--sp-1); font-variant-numeric: tabular-nums; }
  .item-meta .ic { width: 1em; height: 1em; }
  .item-top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
  .note { font-size: var(--fs-s); font-weight: 700; color: var(--primary); }

  /* 状態チップ（文言＋アイコン＋塗り/枠） */
  .chip {
    display: inline-flex; align-items: center; gap: var(--sp-1);
    padding: 2px 10px; border-radius: var(--r-full); border: 1px solid var(--border);
    font-size: var(--fs-s); font-weight: 700; line-height: 1.5; background: var(--surface); color: var(--text-2);
  }
  .chip .ic { width: 1em; height: 1em; }
  .chip.c-key         { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .chip.c-key-outline { background: var(--primary-container); border-color: var(--primary); color: var(--on-primary-container); }
  .chip.c-success     { background: var(--success-bg); border-color: var(--success-line); color: var(--success); }

  .propose-card { margin-top: var(--sp-4); padding: var(--sp-4); border: 1px solid var(--border); border-radius: var(--r-m); background: var(--surface); }
  .propose-card h2 { font-size: var(--fs-l); font-weight: 700; line-height: 1.4; }
  .propose-card p { font-size: var(--fs-s); color: var(--text-2); margin: var(--sp-1) 0 var(--sp-3); }

  .state { display: flex; align-items: flex-start; gap: var(--sp-2); padding: var(--sp-4) 0; color: var(--text-2); }
  .state .ic { margin-top: 2px; }

  /* ─── 詳細 ─── */
  .detail { max-width: 44em; }
  .back { display: none; }
  .d-top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-3); color: var(--text-2); font-size: var(--fs-s); }
  .d-top time { font-variant-numeric: tabular-nums; }
  .d-title { font-size: var(--fs-h1); font-weight: 700; line-height: 1.4; margin-top: var(--sp-3); }
  .d-actions { margin-top: var(--sp-4); display: flex; flex-wrap: wrap; gap: var(--sp-2); }
  .d-sec { margin-top: var(--sp-6); }
  .d-sec > h3 { display: flex; align-items: baseline; gap: var(--sp-2); font-size: var(--fs-xl); font-weight: 700; line-height: 1.4; padding-bottom: var(--sp-2); border-bottom: 1px solid var(--divider); margin-bottom: var(--sp-3); }
  .d-sec > h3 .n { font-size: var(--fs-m); font-weight: 400; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .prose { line-height: 1.9; white-space: pre-wrap; word-break: break-word; }
  .prose.empty { color: var(--text-3); }

  .banner { display: flex; align-items: flex-start; gap: var(--sp-2); padding: 12px var(--sp-3); border: 1px solid; border-radius: var(--r-s); font-size: var(--fs-s); line-height: 1.6; }
  .banner .ic { margin-top: 1px; }
  .banner-title { font-weight: 700; display: block; }
  .banner.success { border-color: var(--success-line); background: var(--success-bg); color: var(--success); margin-top: var(--sp-4); }
  .banner.error { border-color: var(--error-line); background: var(--error-bg); color: var(--error); margin-bottom: var(--sp-3); }

  /* 反応 */
  .stamps { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: var(--sp-2); }
  .stamp {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 76px;
    padding: 10px var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-m); background: var(--surface); text-align: left;
    transition: background-color 150ms var(--ease), color 150ms var(--ease), border-color 150ms var(--ease);
  }
  .stamp:hover { background: var(--primary-container); border-color: var(--primary); }
  .stamp-label { display: inline-flex; align-items: center; gap: var(--sp-1); font-size: var(--fs-s); color: var(--text-2); }
  .stamp-label .ic { width: 1em; height: 1em; display: none; }
  .stamp-count { font-size: var(--fs-h2); font-weight: 700; line-height: 1.3; font-variant-numeric: tabular-nums; }
  .stamp[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .stamp[aria-pressed="true"] .stamp-label { color: var(--on-primary); font-weight: 700; }
  .stamp[aria-pressed="true"] .stamp-label .ic { display: inline; }
  .stamp[aria-busy="true"] { cursor: progress; }
  .hint { font-size: var(--fs-s); color: var(--text-2); margin-top: var(--sp-2); }

  /* コメント */
  .comments { display: grid; gap: var(--sp-3); margin-bottom: var(--sp-4); }
  .comment { display: grid; grid-template-columns: 40px 1fr; gap: 0 12px; }
  .avatar { width: 40px; height: 40px; border-radius: var(--r-full); display: grid; place-items: center; background: var(--bg-sub); border: 1px solid var(--divider); color: var(--text-2); font-weight: 700; font-size: var(--fs-s); }
  .comment.mine .avatar { background: var(--primary-container); border-color: var(--primary); color: var(--on-primary-container); }
  .c-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0 12px; }
  .c-name { font-size: var(--fs-s); font-weight: 700; }
  .c-you { font-size: var(--fs-s); color: var(--text-2); }
  .c-time, .c-edited { font-size: var(--fs-s); color: var(--text-3); font-variant-numeric: tabular-nums; }
  .c-actions { margin-left: auto; display: flex; gap: var(--sp-2); }
  .c-text { line-height: 1.8; word-break: break-word; white-space: pre-wrap; }
  .c-edit { display: none; margin-top: var(--sp-2); }
  .c-edit .row { display: flex; gap: var(--sp-2); justify-content: flex-end; margin-top: var(--sp-2); }

  .compose { padding: var(--sp-4); border: 1px solid var(--border); border-radius: var(--r-m); background: var(--surface); display: grid; gap: var(--sp-3); }
  .compose h4 { font-size: var(--fs-m); font-weight: 700; }
  .compose-foot { display: flex; justify-content: flex-end; }

  /* 入力欄 */
  .f label { display: flex; align-items: baseline; gap: var(--sp-2); font-size: var(--fs-s); font-weight: 700; margin-bottom: var(--sp-1); }
  .req { font-weight: 400; color: var(--text-2); }
  .support { font-size: var(--fs-s); color: var(--text-2); margin-top: var(--sp-1); }
  .err-text { font-size: var(--fs-s); color: var(--error); font-weight: 700; margin-top: var(--sp-1); }
  .field {
    width: 100%; min-height: 48px; padding: var(--sp-2) 12px;
    border: 1px solid var(--border); border-radius: var(--r-s); background: var(--surface);
    transition: border-color 150ms var(--ease);
  }
  .field:hover { border-color: var(--text); }
  .field[aria-invalid="true"] { border: 2px solid var(--error-line); }
  textarea.field { resize: vertical; min-height: 104px; line-height: 1.8; }
  .f-name { max-width: 20em; }

  /* 空の詳細 */
  .detail-empty { display: grid; place-items: center; text-align: center; min-height: 50vh; color: var(--text-2); }
  .detail-empty .ic { width: 48px; height: 48px; color: var(--text-3); margin: 0 auto var(--sp-3); }

  /* ─── 議事録ダイアログ ─── */
  dialog.minutes {
    width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px); margin: auto; padding: 0;
    border: 1px solid var(--border); border-radius: var(--r-xl); background: var(--surface); color: var(--text);
    display: none; flex-direction: column; overflow: hidden;
  }
  dialog.minutes[open] { display: flex; animation: dlg-in 250ms var(--ease-in); }
  dialog.minutes::backdrop { background: var(--scrim); }
  @keyframes dlg-in { from { opacity: 0; transform: translateY(8px); } }
  .dlg-head { padding: var(--sp-4) var(--sp-4) 0; display: grid; grid-template-columns: 1fr auto; gap: 0 var(--sp-3); align-items: start; }
  .dlg-kicker { font-size: var(--fs-s); color: var(--text-2); }
  .dlg-head h2 { font-size: var(--fs-xl); font-weight: 700; line-height: 1.4; }
  .dlg-close { grid-column: 2; grid-row: 1 / span 2; display: inline-flex; align-items: center; gap: var(--sp-1); min-height: 44px; padding: 0 var(--sp-2); margin: -6px -8px 0 0; border-radius: var(--r-s); color: var(--text-2); font-size: var(--fs-s); }
  .dlg-close:hover { background: var(--bg-sub); color: var(--text); }
  .tabs { display: flex; gap: var(--sp-4); padding: 0 var(--sp-4); margin-top: var(--sp-3); border-bottom: 1px solid var(--divider); }
  .tab { min-height: 48px; color: var(--text-2); border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--primary); font-weight: 700; border-color: var(--primary); }
  .dlg-body { padding: var(--sp-4); overflow-y: auto; }
  .gdoc-iframe { width: 100%; height: 56vh; border: 1px solid var(--border); border-radius: var(--r-s); display: block; background: #fff; }

  /* ─── トースト・フッター ─── */
  #toast {
    position: fixed; left: 50%; bottom: var(--sp-4); transform: translate(-50%, 8px);
    background: var(--text); color: var(--bg); font-size: var(--fs-s); padding: 14px var(--sp-4); border-radius: var(--r-s);
    z-index: 600; opacity: 0; pointer-events: none; max-width: calc(100vw - 32px);
    transition: opacity 200ms var(--ease), transform 200ms var(--ease);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  footer { border-top: 1px solid var(--divider); background: var(--surface); }
  footer .in { max-width: 1280px; margin: 0 auto; padding: var(--sp-2) var(--sp-4) var(--sp-4); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-2) var(--sp-4); font-size: var(--fs-s); color: var(--text-2); }
  footer a { display: inline-flex; align-items: center; min-height: 44px; }

  /* ─── 狭い画面: 一覧と詳細を切り替え ─── */
  @media (max-width: 839px) {
    .appbar-in, .views ul { padding: 0 var(--sp-2); }
    .views ul { gap: 0; }
    .views a { padding: 0 12px; }
    .brand-sub { display: none; }
    .appbar .btn span.long { display: none; }
    .layout { grid-template-columns: 1fr; min-height: 0; }
    .list-pane { border-right: none; padding: var(--sp-4) var(--sp-3) var(--sp-5); }
    .detail-pane { padding: var(--sp-3) var(--sp-3) 80px; }
    .layout[data-mode="list"] .detail-pane { display: none; }
    .layout[data-mode="detail"] .list-pane { display: none; }
    .back { display: inline-flex; margin-left: -4px; margin-bottom: var(--sp-2); }
    .d-title { font-size: var(--fs-h2); }
    .detail-empty { display: none; }
  }
  @media (min-width: 840px) and (max-width: 1099px) { :root { --list-w: 340px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 1ms !important; animation: none !important; }
  }

  /* 明るい面（MD3の塗りカード風）: 白地に淡い面、濃い枠線を使わない */
  .item, .stamp, .compose, .sec, .stat, .propose-card, .login { border-color: transparent !important; border-radius: 24px !important; }

</style>

<script>
const SUPABASE_URL  = 'https://ggdjoxnjwqthhkwpcvqq.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdnZGpveG5qd3F0aGhrd3BjdnFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNTYyNjIsImV4cCI6MjA5MzczMjI2Mn0.X1AvGI5I8I94siB6MS1B_ou9TlA5864wUNsuy6SK4bc';

// Lucide アイコン（lucide.dev の SVG パス）
const LUCIDE = {
  'plus':          '<path d="M5 12h14"/><path d="M12 5v14"/>',

  'circle-alert':  '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
  'circle-check':  '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  'circle':        '<circle cx="12" cy="12" r="10"/>',
  'calendar':      '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
  'message-circle':'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  'message-square':'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  'thumbs-up':     '<path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/>',
  'file-text':     '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  'external-link': '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  'chevron-left':  '<path d="m15 18-6-6 6-6"/>',
  'list':          '<path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/>',
  'pencil':        '<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
  'trash-2':       '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
  'send':          '<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>',
};
const ic = name => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${LUCIDE[name]}</svg>`;

// reactions.emoji 列にはこのキー文字列がそのまま保存されている
const STAMPS = ['関心あり', '議論したい', '賛成', '反対', '様子見'];

const STATUS_CFG = {
  '提案中':      { label:'検討中',   chip:'',              icon:'circle',         view:'proposals' },
  '取り上げ確定': { label:'採択予定', chip:'c-key-outline', icon:'calendar',       view:'proposals' },
  '議論中':      { label:'審議中',   chip:'c-key',         icon:'message-circle', view:'active'    },
  '決議済み':    { label:'決議済み', chip:'c-success',     icon:'circle-check',   view:'past'      },
};
const VIEWS = {
  active:    { title:'審議中の議案',     desc:'直近の全体会議で取り上げられている議題です。議事録から議論の経過を確認できます。', empty:'現在、審議中の議案はありません。' },
  proposals: { title:'居住者からの提案', desc:'反応やコメントで関心を示してください。支持が集まった提案は全体会議の議題になります。', empty:'現在、提案はありません。' },
  past:      { title:'過去の議案',       desc:'これまでの全体会議で決議された議案です。', empty:'まだ決議された議案はありません。' },
};
const cfgOf  = p => STATUS_CFG[p.status] || STATUS_CFG['提案中'];
const chipOf = p => { const c = cfgOf(p); return `<span class="chip ${c.chip}">${ic(c.icon)}${c.label}</span>`; };

// ─── 利用者の識別（端末ごと） ───
function getSessionId() {
  let id = localStorage.getItem('sc_session_id');
  if (!id) {
    id = typeof crypto.randomUUID === 'function' ? crypto.randomUUID()
      : ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
    localStorage.setItem('sc_session_id', id);
  }
  return id;
}
const getSavedName = () => localStorage.getItem('sc_username') || '';
const saveName = n => { if (n) localStorage.setItem('sc_username', n); };

// ─── 状態 ───
const state = { items: {}, reactN: {}, commentN: {}, view: 'active', sel: null, q: '', loaded: false };
const wide = matchMedia('(min-width: 840px)');

function itemsOf(view) {
  return Object.values(state.items)
    .filter(p => cfgOf(p).view === view)
    .sort((a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0) || String(a.created_at).localeCompare(String(b.created_at)));
}
function matches(p, q) {
  return !q || `${p.title} ${p.description || ''} ${p.summary || ''}`.toLowerCase().includes(q);
}

// ─── 画面の切替（URLの # で表示中の分類と議案を保持） ───
function route() {
  const [v, id] = location.hash.slice(1).split('/');
  const view = VIEWS[v] ? v : 'active';
  const changedView = view !== state.view;
  state.view = view;
  let sel = id && Object.hasOwn(state.items, id) ? id : null;
  // 議案の状態が変わって別の分類に移っていたら、その分類へ移す
  if (sel && cfgOf(state.items[sel]).view !== view) { history.replaceState(null, '', `#${cfgOf(state.items[sel]).view}/${sel}`); return route(); }
  if (!sel && wide.matches && state.loaded) {
    const first = itemsOf(view).find(p => matches(p, state.q));
    if (first) { history.replaceState(null, '', `#${view}/${first.item_id}`); sel = first.item_id; }
  }
  if (changedView) { state.q = ''; document.getElementById('q').value = ''; }
  const selChanged = sel !== state.sel;
  state.sel = sel;
  renderNav(); renderList();
  if (selChanged || !document.querySelector('.detail')) renderDetail();
  document.getElementById('layout').dataset.mode = sel ? 'detail' : 'list';
}
window.addEventListener('hashchange', () => {
  route();
  if (!wide.matches && state.sel) document.getElementById('detail').focus({ preventScroll: true }), scrollTo(0, 0);
});
wide.addEventListener('change', route);

function renderNav() {
  for (const v of Object.keys(VIEWS)) {
    const a = document.querySelector(`.views a[data-view="${v}"]`);
    if (v === state.view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    document.getElementById(`n-${v}`).textContent = state.loaded ? itemsOf(v).length : '-';
  }
}

function renderList() {
  const v = VIEWS[state.view];
  document.getElementById('pane-title').textContent = v.title;
  document.getElementById('pane-desc').textContent = v.desc;
  document.getElementById('search').hidden = state.view !== 'past';
  document.getElementById('propose-card').hidden = state.view !== 'proposals' || !state.loaded;
  if (!state.loaded) return;

  const all = itemsOf(state.view);
  const list = all.filter(p => matches(p, state.q));
  const st = document.getElementById('list-state');
  st.hidden = list.length > 0;
  if (!list.length) st.innerHTML = `${ic('list')}<span>${state.q ? '該当する議案はありません。検索語を変えてください。' : v.empty}</span>`;
  document.getElementById('q-count').textContent = state.q ? `${list.length}件が該当` : '';
  document.getElementById('q-clear').hidden = !state.q;

  document.getElementById('items').innerHTML = list.map(p => `
    <li><a class="item" href="#${state.view}/${escHtml(p.item_id)}" ${p.item_id === state.sel ? 'aria-current="true"' : ''}>
      <span class="item-top">${chipOf(p)}${p.status === '取り上げ確定' ? '<span class="note">次回の議題に採用</span>' : ''}</span>
      <span class="item-title">${escHtml(p.title)}</span>
      <span class="item-meta">
        ${p.created_at ? `<span><time datetime="${escHtml(p.created_at)}">${fmtDate(p.created_at)}</time></span>` : ''}
        <span>${ic('thumbs-up')}反応 ${state.reactN[p.item_id] || 0}</span>
        <span>${ic('message-square')}コメント ${state.commentN[p.item_id] || 0}</span>
      </span>
    </a></li>`).join('');
}

// ─── 詳細 ───
function renderDetail() {
  const el = document.getElementById('detail');
  const p = state.items[state.sel];
  if (!p) {
    el.innerHTML = `<div class="detail-empty"><div>${ic('list')}<p>一覧から議案を選ぶと、内容・反応・コメントが表示されます。</p></div></div>`;
    return;
  }
  const id = p.item_id;
  el.innerHTML = `
    <article class="detail" aria-labelledby="d-title">
      <a class="btn-text back" href="#${state.view}">${ic('chevron-left')}一覧に戻る</a>
      <div id="d-head"></div>

      <section class="d-sec" aria-labelledby="h-stamps">
        <h3 id="h-stamps">反応<span class="n" id="d-rn"></span></h3>
        <div class="banner error" id="err-stamps" hidden></div>
        <div class="stamps" id="stamps" role="group" aria-label="反応を選ぶ">
          ${STAMPS.map(k => `<button class="stamp" data-key="${k}" aria-pressed="false" onclick="react(this)">
            <span class="stamp-label">${ic('check')}${k}</span><span class="stamp-count">-</span></button>`).join('')}
        </div>
        <p class="hint">押すと反応が記録されます。もう一度押すと取り消せます。</p>
      </section>

      <section class="d-sec" aria-labelledby="h-comments">
        <h3 id="h-comments">コメント<span class="n" id="d-cn"></span></h3>
        <div class="banner error" id="err-comments" hidden></div>
        <div class="comments" id="comments"><div class="state">${ic('hourglass')}<span>コメントを読み込んでいます</span></div></div>
        <div class="compose">
          <h4>コメントを書く</h4>
          <div class="f f-name">
            <label for="cname">名前<span class="req">※任意</span></label>
            <input class="field" id="cname" type="text" autocomplete="nickname" aria-describedby="cname-h" value="${escHtml(getSavedName())}" onblur="saveName(this.value.trim())">
            <p class="support" id="cname-h">空欄なら「匿名」と表示されます</p>
          </div>
          <div class="f">
            <label for="ctext">コメント<span class="req">※必須</span></label>
            <textarea class="field" id="ctext" rows="3" aria-describedby="ctext-h ctext-err" onkeydown="commentKey(event)" oninput="clearErr()"></textarea>
            <p class="support" id="ctext-h">Enterで送信、Shift＋Enterで改行</p>
            <p class="err-text" id="ctext-err" hidden>＊コメントを入力してください。</p>
          </div>
          <div class="compose-foot"><button class="btn" id="csend" onclick="submitComment()">${ic('send')}<span>送信</span></button></div>
        </div>
      </section>
    </article>`;
  renderHead();
  loadStamps(id);
  loadComments(id);
}

// 見出し部分だけ描き直す（入力中のコメントを消さないため）
function renderHead() {
  const p = state.items[state.sel];
  const head = document.getElementById('d-head');
  if (!p || !head) return;
  const desc = (p.description || '').trim();
  const hasMinutes = p.status === '議論中' || p.status === '決議済み';
  head.innerHTML = `
    <div class="d-top">${chipOf(p)}${p.status === '取り上げ確定' ? '<span class="note">次回の議題に採用</span>' : ''}
      ${p.created_at ? `<span>提案日 <time datetime="${escHtml(p.created_at)}">${fmtDate(p.created_at)}</time></span>` : ''}</div>
    <h2 class="d-title" id="d-title">${escHtml(p.title)}</h2>
    ${p.status === '決議済み' ? `<div class="banner success">${ic('circle-check')}<span><span class="banner-title">決議済み</span>この議案は全体会議で決議されました。経過は議事録から確認できます。</span></div>` : ''}
    ${hasMinutes ? `<div class="d-actions"><button class="btn outline" onclick="openMinutes(this)">${ic('file-text')}議事録を読む</button></div>` : ''}
    <section class="d-sec" aria-labelledby="h-desc">
      <h3 id="h-desc">内容</h3>
      <div class="prose${desc ? '' : ' empty'}">${desc ? escHtml(desc) : '提案内容は記載されていません。'}</div>
    </section>`;
}

// ─── データ取得 ───
async function fetchAll() {
  const [pr, rx, cm] = await Promise.all([
    // 非公開の議案はブラウザに届く前にサーバー側で除く（本当の防御はRLS。これは多重化）
    db.from('proposals').select('*').not('is_published', 'is', false).order('sort_order', { ascending: true }).order('created_at', { ascending: true }),
    db.from('reactions').select('item_id'),
    db.from('comments').select('item_id'),
  ]);
  if (pr.error) {
    console.error(pr.error);
    document.getElementById('list-state').innerHTML = `${ic('circle-alert')}<span>議案を読み込めませんでした。時間をおいてページを再読み込みしてください。</span>`;
    return;
  }
  (pr.data || []).forEach(p => { if (p.is_published !== false) state.items[p.item_id] = p; });
  (rx.data || []).forEach(r => state.reactN[r.item_id] = (state.reactN[r.item_id] || 0) + 1);
  (cm.data || []).forEach(c => state.commentN[c.item_id] = (state.commentN[c.item_id] || 0) + 1);
  state.loaded = true;
  route();
}

async function loadStamps(itemId) {
  const { data, error } = await db.from('reactions').select('emoji,session_id').eq('item_id', itemId);
  if (state.sel !== itemId) return;
  const box = document.getElementById('stamps');
  if (error) {
    showErr('stamps', '反応を読み込めませんでした。時間をおいて開き直してください。');
    box.querySelectorAll('.stamp-count').forEach(c => c.textContent = '-');
    return;
  }
  const counts = {}, mine = new Set(), sid = getSessionId();
  (data || []).forEach(r => { counts[r.emoji] = (counts[r.emoji] || 0) + 1; if (r.session_id === sid) mine.add(r.emoji); });
  box.querySelectorAll('.stamp').forEach(b => {
    b.querySelector('.stamp-count').textContent = counts[b.dataset.key] || 0;
    b.setAttribute('aria-pressed', mine.has(b.dataset.key));
  });
  state.reactN[itemId] = (data || []).length;
  updateTotals();
}

async function loadComments(itemId) {
  const { data, error } = await db.from('comments').select('*').eq('item_id', itemId).order('created_at', { ascending: true });
  if (state.sel !== itemId) return;
  const list = document.getElementById('comments');
  list.innerHTML = '';
  if (error) { showErr('comments', 'コメントを読み込めませんでした。時間をおいて開き直してください。'); return; }
  if (!data?.length) list.innerHTML = '<p class="state">まだコメントはありません。最初の意見を書いてみてください。</p>';
  else data.forEach(c => appendComment(c));
  state.commentN[itemId] = (data || []).length;
  updateTotals();
}

function updateTotals() {
  const id = state.sel;
  const rn = document.getElementById('d-rn'), cn = document.getElementById('d-cn');
  if (rn) rn.textContent = `${state.reactN[id] || 0}件`;
  if (cn) cn.textContent = `${state.commentN[id] || 0}件`;
  renderList();
}

// ─── リアルタイム反映 ───
function subscribeAll() {
  const upsert = p => {
    if (p.is_published === false) delete state.items[p.item_id];
    else state.items[p.item_id] = p;
    afterChange(p.item_id);
  };
  db.channel('proposals-watch')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'proposals' }, e => upsert(e.new))
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'proposals' }, e => upsert(e.new))
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'proposals' }, e => {
      const p = Object.values(state.items).find(x => x.id === e.old?.id);
      if (p) { delete state.items[p.item_id]; afterChange(p.item_id); }
    })
    .subscribe();

  db.channel('comments-watch')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'comments' }, e => {
      const c = e.new;
      if (c.session_id === getSessionId()) return;  // 自分の投稿は送信時に反映済み
      state.commentN[c.item_id] = (state.commentN[c.item_id] || 0) + 1;
      if (state.sel === c.item_id) { document.querySelector('#comments > .state')?.remove(); appendComment(c); }
      updateTotals();
    })
    .subscribe();
}
function afterChange(itemId) {
  if (itemId === state.sel) {
    if (!state.items[itemId]) { history.replaceState(null, '', `#${state.view}`); state.sel = null; renderDetail(); }
    else renderHead();
  }
  route();
}

// ─── 反応 ───
async function react(btn) {
  if (btn.getAttribute('aria-busy') === 'true') return;
  const itemId = state.sel, key = btn.dataset.key, sid = getSessionId();
  const on = btn.getAttribute('aria-pressed') === 'true';
  const countEl = btn.querySelector('.stamp-count');
  const prev = parseInt(countEl.textContent) || 0;
  btn.setAttribute('aria-busy', 'true');
  hideErr('stamps');
  const set = (pressed, n, delta) => { btn.setAttribute('aria-pressed', pressed); countEl.textContent = n; state.reactN[itemId] = (state.reactN[itemId] || 0) + delta; updateTotals(); };
  if (on) {
    set(false, Math.max(0, prev - 1), -1);
    const { error } = await db.from('reactions').delete().eq('item_id', itemId).eq('emoji', key).eq('session_id', sid);
    if (error) { set(true, prev, 1); showErr('stamps', `「${key}」を取り消せませんでした。もう一度押してください。`); }
  } else {
    set(true, prev + 1, 1);
    const { error } = await db.from('reactions').insert({ item_id: itemId, emoji: key, session_id: sid });
    if (error) { set(false, prev, -1); showErr('stamps', `「${key}」を記録できませんでした。もう一度押してください。`); }
  }
  btn.removeAttribute('aria-busy');
}

// ─── コメント ───
function commentKey(e) {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submitComment(); }
}
function clearErr() {
  document.getElementById('ctext').removeAttribute('aria-invalid');
  document.getElementById('ctext-err').hidden = true;
}
async function submitComment() {
  const itemId = state.sel;
  const input = document.getElementById('ctext'), nameEl = document.getElementById('cname'), btn = document.getElementById('csend');
  if (btn.getAttribute('aria-disabled') === 'true') return;
  const text = input.value.trim();
  if (!text) { input.setAttribute('aria-invalid', 'true'); document.getElementById('ctext-err').hidden = false; input.focus(); return; }
  const name = nameEl.value.trim() || '匿名';
  saveName(nameEl.value.trim());
  btn.setAttribute('aria-disabled', 'true'); btn.querySelector('span').textContent = '送信中';
  hideErr('comments');
  const { data, error } = await db.from('comments')
    .insert({ item_id: itemId, author: name, content: text, session_id: getSessionId() }).select().single();
  btn.removeAttribute('aria-disabled'); btn.querySelector('span').textContent = '送信';
  if (error) { showErr('comments', 'コメントを送信できませんでした。入力内容は残っています。もう一度送信してください。'); return; }
  if (state.sel !== itemId) return;
  document.querySelector('#comments > .state')?.remove();
  appendComment(data, true);
  state.commentN[itemId] = (state.commentN[itemId] || 0) + 1;
  updateTotals();
  input.value = '';
  input.focus();
  showToast('コメントを送信しました');
}

function appendComment(c, scroll = false) {
  const mine = c.session_id === getSessionId();
  const author = c.author || '匿名';
  const el = document.createElement('div');
  el.className = 'comment' + (mine ? ' mine' : '');
  el.dataset.commentId = c.id;
  el.innerHTML = `
    <span class="avatar" aria-hidden="true">${escHtml([...author][0] || '匿')}</span>
    <div>
      <div class="c-head">
        <span class="c-name">${escHtml(author)}</span>${mine ? '<span class="c-you">あなた</span>' : ''}
        <span class="c-time">${formatTime(c.created_at)}</span>
        <span class="c-edited" hidden>編集済み</span>
        ${mine ? `<span class="c-actions">
          <button class="btn-text" onclick="startEdit(this)">${ic('pencil')}編集</button>
          <button class="btn-text danger" onclick="deleteComment(this)">${ic('trash-2')}削除</button></span>` : ''}
      </div>
      <p class="c-text"></p>
      <div class="c-edit">
        <label class="sr-only" for="ce-${escHtml(c.id)}">コメントを編集</label>
        <textarea class="field" id="ce-${escHtml(c.id)}"></textarea>
        <div class="row"><button class="btn outline sm" onclick="cancelEdit(this)">キャンセル</button><button class="btn sm" onclick="saveEdit(this)">保存</button></div>
      </div>
    </div>`;
  el.querySelector('.c-text').textContent = c.content;
  document.getElementById('comments').appendChild(el);
  if (scroll) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'nearest' });
}
function startEdit(btn) {
  const c = btn.closest('.comment');
  const ta = c.querySelector('.c-edit textarea');
  ta.value = c.querySelector('.c-text').textContent;
  c.querySelector('.c-text').style.display = 'none';
  c.querySelector('.c-actions').style.display = 'none';
  c.querySelector('.c-edit').style.display = 'block';
  ta.focus();
}
function cancelEdit(btn) {
  const c = btn.closest('.comment');
  c.querySelector('.c-text').style.display = '';
  c.querySelector('.c-actions').style.display = '';
  c.querySelector('.c-edit').style.display = 'none';
  c.querySelector('.c-actions .btn-text')?.focus();
}
async function saveEdit(btn) {
  const c = btn.closest('.comment');
  const ta = c.querySelector('.c-edit textarea');
  const text = ta.value.trim();
  if (!text) { ta.focus(); return; }
  if (btn.getAttribute('aria-disabled') === 'true') return;
  btn.setAttribute('aria-disabled', 'true'); btn.textContent = '保存中';
  const { error } = await db.from('comments').update({ content: text }).eq('id', c.dataset.commentId).eq('session_id', getSessionId());
  btn.removeAttribute('aria-disabled'); btn.textContent = '保存';
  if (error) { showToast('編集を保存できませんでした。もう一度保存してください。'); return; }
  c.querySelector('.c-text').textContent = text;
  c.querySelector('.c-edited').hidden = false;
  cancelEdit(btn);
  showToast('編集を保存しました');
}
async function deleteComment(btn) {
  if (!confirm('このコメントを削除しますか。')) return;
  const c = btn.closest('.comment'), itemId = state.sel;
  const { error } = await db.from('comments').delete().eq('id', c.dataset.commentId).eq('session_id', getSessionId());
  if (error) { showToast('コメントを削除できませんでした。もう一度お試しください。'); return; }
  c.remove();
  state.commentN[itemId] = Math.max(0, (state.commentN[itemId] || 1) - 1);
  if (!document.querySelector('#comments .comment')) document.getElementById('comments').innerHTML = '<p class="state">まだコメントはありません。最初の意見を書いてみてください。</p>';
  updateTotals();
  showToast('コメントを削除しました');
}

// ─── 議事録ダイアログ ───
function toGdocEmbed(url) {
  const m = url.match(/\/document\/d\/([a-zA-Z0-9_-]+)/);
  return m ? `https://docs.google.com/document/d/${m[1]}/preview` : null;
}
function fillProse(el, text, emptyMsg) {
  const has = text && text.trim();
  el.className = 'prose' + (has ? '' : ' empty');
  el.textContent = has ? text : emptyMsg;
}
let minutesOpener = null;
function openMinutes(btn) {
  const p = state.items[state.sel];
  if (!p) return;
  minutesOpener = btn;
  document.getElementById('mm-title').textContent = p.title;
  fillProse(document.getElementById('mm-minutes'), p.minutes, '議事録はまだ入力されていません。');
  fillProse(document.getElementById('mm-summary'), p.summary, '要約はまだ入力されていません。');
  const gdoc = (p.gdoc_url || '').trim(), panel = document.getElementById('mp-gdoc');
  panel.innerHTML = '';
  document.getElementById('mt-gdoc').hidden = !gdoc;
  if (gdoc) {
    const embed = toGdocEmbed(gdoc);
    if (embed) {
      const f = document.createElement('iframe');
      f.src = embed; f.className = 'gdoc-iframe'; f.title = `${p.title} の Google ドキュメント`;
      panel.appendChild(f);
    } else if (/^https?:\/\//.test(gdoc)) {
      const a = document.createElement('a');
      a.href = gdoc; a.target = '_blank'; a.rel = 'noopener';
      a.innerHTML = `Google ドキュメントを開く${ic('external-link')}<span class="sr-only">（新しいタブで開きます）</span>`;
      panel.appendChild(a);
    }
  }
  minutesTab('minutes');
  const dlg = document.getElementById('minutes');
  dlg.showModal();
  dlg.querySelector('.dlg-close').focus();
}
function closeMinutes() { document.getElementById('minutes').close(); }
document.getElementById('minutes').addEventListener('close', () => { minutesOpener?.focus(); minutesOpener = null; });
document.getElementById('minutes').addEventListener('click', e => { if (e.target === e.currentTarget) closeMinutes(); });
function minutesTab(key) {
  ['minutes', 'summary', 'gdoc'].forEach(k => {
    const t = document.getElementById(`mt-${k}`);
    t.setAttribute('aria-selected', k === key); t.tabIndex = k === key ? 0 : -1;
    document.getElementById(`mp-${k}`).hidden = k !== key;
  });
}
function tabKey(e) {
  const tabs = [...e.currentTarget.querySelectorAll('[role="tab"]:not([hidden])')];
  const i = tabs.indexOf(document.activeElement);
  const next = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
  if (i < 0 || next === undefined) return;
  e.preventDefault();
  const t = tabs[(next + tabs.length) % tabs.length];
  t.focus(); t.click();
}

// ─── 検索（過去の議案） ───
function onSearch(v) {
  state.q = v.toLowerCase().trim();
  document.getElementById('q-clear').hidden = !v;
  renderList();
}
function clearSearch() {
  const el = document.getElementById('q');
  el.value = ''; onSearch(''); el.focus();
}

// ─── ユーティリティ ───
function showErr(type, msg) {
  const el = document.getElementById(`err-${type}`);
  if (el) { el.innerHTML = `${ic('circle-alert')}<span>${escHtml(msg)}</span>`; el.hidden = false; }
}
function hideErr(type) { const el = document.getElementById(`err-${type}`); if (el) el.hidden = true; }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 5000);
}
function fmtDate(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
}
function formatTime(iso) {
  if (!iso) return 'たった今';
  const d = new Date(iso), diff = (Date.now() - d) / 1000;
  if (diff < 60) return 'たった今';
  if (diff < 3600) return `${Math.floor(diff / 60)}分前`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}時間前`;
  return `${fmtDate(iso)} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

(() => {
  const d = new Date();
  document.getElementById('today').textContent = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`;
  document.querySelectorAll('[data-icon]').forEach(s => { s.outerHTML = ic(s.dataset.icon); });
})();
route();
fetchAll();
subscribeAll();
</script>
