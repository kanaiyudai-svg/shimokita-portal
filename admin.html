<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理者パネル | Shimokita College</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --primary: #18181b; --primary-light: #52525b;
    --accent: #6366f1; --accent-light: #e0e7ff;
    --bg: #fafafa; --surface: #ffffff; --surface2: #f9fafb;
    --text: #18181b; --text-muted: #71717a; --border: #e4e4e7;
    --radius: 12px; --radius-sm: 8px;
    --shadow: 0 1px 8px rgba(0,0,0,0.07);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
    --s-pending-bg:#fefce8;  --s-pending-text:#854d0e;  --s-pending-border:#fde68a;
    --s-adopted-bg:#fefce8;  --s-adopted-text:#92400e;  --s-adopted-border:#fbbf24;
    --s-active-bg:#f0fdf4;   --s-active-text:#166534;   --s-active-border:#bbf7d0;
    --s-resolved-bg:#eff6ff; --s-resolved-text:#1e40af; --s-resolved-border:#bfdbfe;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }

  /* ═══ ログイン ═══ */
  #login-section { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:40px 36px; width:100%; max-width:380px; box-shadow:var(--shadow-lg); }
  .login-logo { display:flex; align-items:center; gap:10px; margin-bottom:28px; }
  .login-logo-icon { width:36px; height:36px; background:var(--primary); border-radius:9px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:1.1rem; }
  .login-logo-text { font-size:.95rem; font-weight:700; color:var(--primary); }
  .login-logo-sub  { font-size:.75rem; color:var(--text-muted); margin-top:1px; }
  .login-title { font-size:1.15rem; font-weight:700; margin-bottom:6px; }
  .login-sub   { font-size:.82rem; color:var(--text-muted); margin-bottom:24px; }
  .form-group  { margin-bottom:14px; }
  .form-group label { display:block; font-size:.8rem; font-weight:600; color:var(--primary-light); margin-bottom:5px; }
  .form-group input { width:100%; border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:10px 13px; font-size:.9rem; font-family:inherit; outline:none; background:var(--surface2); transition:border-color .15s; color:var(--text); }
  .form-group input:focus { border-color:var(--accent); background:#fff; }
  .login-btn { width:100%; background:var(--primary); color:#fff; border:none; border-radius:var(--radius-sm); padding:11px; font-size:.9rem; font-weight:700; cursor:pointer; transition:background .15s; margin-top:6px; }
  .login-btn:hover    { background:#3f3f46; }
  .login-btn:disabled { background:#a1a1aa; cursor:default; }
  .login-error { margin-top:12px; padding:10px 13px; background:#fef2f2; border:1px solid #fecaca; border-radius:var(--radius-sm); font-size:.82rem; color:#991b1b; display:none; }
  .login-error.show { display:block; }

  /* ═══ 管理パネル共通 ═══ */
  #admin-section { display:none; }
  .admin-topbar { background:#fff; border-bottom:1px solid var(--border); padding:0 24px; position:sticky; top:0; z-index:100; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .admin-topbar-inner { max-width:900px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:58px; }
  .admin-logo { font-size:.95rem; font-weight:700; color:var(--primary); display:flex; align-items:center; gap:8px; }
  .admin-logo-icon { width:26px; height:26px; background:var(--primary); border-radius:6px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:.85rem; }
  .admin-badge { font-size:.68rem; font-weight:700; background:var(--accent); color:#fff; padding:2px 8px; border-radius:999px; margin-left:6px; }
  .topbar-right { display:flex; align-items:center; gap:12px; }
  .user-email  { font-size:.78rem; color:var(--text-muted); }
  .logout-btn  { background:none; border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:6px 14px; font-size:.8rem; font-weight:600; color:var(--text-muted); cursor:pointer; transition:border-color .15s,color .15s; }
  .logout-btn:hover { border-color:#a1a1aa; color:var(--primary); }
  .admin-main  { max-width:900px; margin:0 auto; padding:36px 16px 64px; }
  .page-title  { font-size:1.1rem; font-weight:700; margin-bottom:4px; }
  .page-sub    { font-size:.82rem; color:var(--text-muted); margin-bottom:28px; }
  .back-link   { display:inline-flex; align-items:center; gap:5px; font-size:.8rem; color:var(--text-muted); text-decoration:none; margin-bottom:20px; }
  .back-link:hover { color:var(--primary); }
  .admin-loading { padding:40px; text-align:center; color:var(--text-muted); font-size:.88rem; }

  /* ═══ 新規作成フォーム ═══ */
  .create-section { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:20px; overflow:hidden; }
  .create-toggle  { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; cursor:pointer; user-select:none; transition:background .15s; }
  .create-toggle:hover { background:var(--surface2); }
  .create-toggle-label { font-size:.9rem; font-weight:700; color:var(--primary); }
  .create-chevron { font-size:.7rem; color:var(--text-muted); transition:transform .2s; }
  .create-chevron.open { transform:rotate(180deg); }
  .create-body { display:none; border-top:1px solid var(--border); padding:16px 20px 20px; }
  .create-body.open { display:block; }
  .create-row  { margin-bottom:12px; }
  .create-row label { display:block; font-size:.78rem; font-weight:600; color:var(--primary-light); margin-bottom:5px; }
  .create-input, .create-textarea { width:100%; border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:9px 13px; font-size:.88rem; font-family:inherit; outline:none; background:var(--surface2); transition:border-color .15s; color:var(--text); }
  .create-input:focus, .create-textarea:focus { border-color:var(--accent); background:#fff; }
  .create-textarea { min-height:80px; resize:vertical; }
  .create-footer { display:flex; align-items:center; gap:10px; margin-top:14px; }
  .create-btn { background:var(--primary); color:#fff; border:none; border-radius:var(--radius-sm); padding:9px 22px; font-size:.88rem; font-weight:700; cursor:pointer; transition:background .15s; }
  .create-btn:hover    { background:#3f3f46; }
  .create-btn:disabled { background:#a1a1aa; cursor:default; }
  .create-fb { font-size:.8rem; }
  .create-fb.ok  { color:#16a34a; }
  .create-fb.err { color:#dc2626; }

  /* ═══ 議案カード ═══ */
  .proposals-list { display:flex; flex-direction:column; gap:16px; }
  .proposal-card  { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }

  /* カードヘッダー（常時表示・クリックで開閉） */
  .pc-header {
    padding:16px 20px; display:flex; align-items:center; gap:12px;
    cursor:pointer; user-select:none; transition:background .15s;
  }
  .pc-header:hover { background:var(--surface2); }
  .pc-header-main  { flex:1; min-width:0; }
  .pc-title-row    { display:flex; align-items:flex-start; gap:8px; flex-wrap:wrap; }
  .pc-title        { font-size:1rem; font-weight:700; line-height:1.4; flex:1; min-width:0; }
  .pc-badge        { flex-shrink:0; padding:3px 9px; border-radius:999px; font-size:.71rem; font-weight:700; white-space:nowrap; margin-top:2px; }
  .pc-badge.status-pending  { background:var(--s-pending-bg);  color:var(--s-pending-text);  border:1px solid var(--s-pending-border);  }
  .pc-badge.status-adopted  { background:var(--s-adopted-bg);  color:var(--s-adopted-text);  border:1px solid var(--s-adopted-border);  }
  .pc-badge.status-active   { background:var(--s-active-bg);   color:var(--s-active-text);   border:1px solid var(--s-active-border);   }
  .pc-badge.status-resolved { background:var(--s-resolved-bg); color:var(--s-resolved-text); border:1px solid var(--s-resolved-border); }
  .pc-date    { font-size:.75rem; color:#a1a1aa; margin-top:3px; }
  .pc-chevron { flex-shrink:0; font-size:.75rem; color:#a1a1aa; transition:transform .2s; }
  .proposal-card.open .pc-chevron { transform:rotate(180deg); }

  /* カードボディ（折りたたみ） */
  .pc-body { display:none; border-top:1px solid var(--border); }
  .proposal-card.open .pc-body { display:block; }

  /* ボディ内：説明・要約プレビュー */
  .pc-preview { padding:12px 20px 14px; background:var(--surface2); border-bottom:1px solid var(--border); font-size:.85rem; color:var(--primary-light); line-height:1.7; }
  .pc-preview-label { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); margin-bottom:5px; }

  /* ステータス変更 */
  .status-changer { padding:16px 20px; border-bottom:1px solid var(--border); }
  .status-changer-label { font-size:.74rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:10px; }
  .status-buttons { display:flex; flex-wrap:wrap; gap:7px; }
  .status-opt { display:flex; align-items:center; gap:7px; padding:8px 14px; border-radius:var(--radius-sm); border:1.5px solid var(--border); background:var(--surface); cursor:pointer; font-size:.84rem; font-weight:600; color:var(--text-muted); transition:all .15s; user-select:none; }
  .status-opt:hover    { border-color:#a1a1aa; color:var(--primary); }
  .status-opt:disabled { opacity:.5; cursor:default; }
  .status-opt.selected { border-color:transparent; font-weight:700; box-shadow:0 0 0 2px currentColor; }
  .status-opt.selected.s-提案中      { background:var(--s-pending-bg);  color:var(--s-pending-text);  }
  .status-opt.selected.s-取り上げ確定 { background:var(--s-adopted-bg);  color:var(--s-adopted-text);  }
  .status-opt.selected.s-議論中      { background:var(--s-active-bg);   color:var(--s-active-text);   }
  .status-opt.selected.s-決議済み    { background:var(--s-resolved-bg); color:var(--s-resolved-text); }
  .sdot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .sdot-提案中      { background:#f59e0b; }
  .sdot-取り上げ確定 { background:#f77f00; }
  .sdot-議論中      { background:#22c55e; }
  .sdot-決議済み    { background:#3b82f6; }
  .status-fb { margin-top:10px; font-size:.8rem; min-height:18px; display:flex; align-items:center; gap:6px; }
  .status-fb.saving  { color:var(--accent); }
  .status-fb.success { color:#16a34a; }
  .status-fb.error   { color:#dc2626; }

  /* 議事録エディタ */
  .minutes-editor { padding:16px 20px 20px; border-bottom:1px solid var(--border); }
  .minutes-editor-label { font-size:.74rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:12px; }
  .minutes-field { margin-bottom:12px; }
  .minutes-field-label { font-size:.78rem; font-weight:600; color:var(--primary-light); margin-bottom:5px; }
  .minutes-textarea { width:100%; border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:10px 13px; font-size:.85rem; font-family:inherit; outline:none; background:var(--surface2); resize:vertical; color:var(--text); line-height:1.65; transition:border-color .15s; }
  .minutes-textarea:focus { border-color:var(--accent); background:#fff; }
  .minutes-textarea.body    { min-height:120px; }
  .minutes-textarea.summary { min-height:70px; }
  .minutes-save-row { display:flex; align-items:center; gap:12px; margin-top:4px; }
  .minutes-save-btn { background:var(--primary); color:#fff; border:none; border-radius:var(--radius-sm); padding:9px 20px; font-size:.84rem; font-weight:700; cursor:pointer; transition:background .15s; flex-shrink:0; }
  .minutes-save-btn:hover    { background:#3f3f46; }
  .minutes-save-btn:disabled { background:#a1a1aa; cursor:default; }
  .minutes-save-fb { font-size:.8rem; min-height:18px; display:flex; align-items:center; gap:6px; }
  .minutes-save-fb.saving  { color:var(--accent); }
  .minutes-save-fb.success { color:#16a34a; }
  .minutes-save-fb.error   { color:#dc2626; }

  /* アクションバー */
  .pc-actions { padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .actions-left, .actions-right { display:flex; gap:6px; }
  .action-btn { display:inline-flex; align-items:center; gap:5px; padding:6px 14px; border-radius:var(--radius-sm); border:1.5px solid var(--border); background:var(--surface); font-size:.8rem; font-weight:600; color:var(--text-muted); cursor:pointer; transition:all .15s; }
  .action-btn:hover          { border-color:#a1a1aa; color:var(--primary); background:#f4f4f5; }
  .action-btn.published      { border-color:#bbf7d0; color:#166534; background:#f0fdf4; }
  .action-btn.published:hover { border-color:#4ade80; }
  .action-btn.unpublished    { border-color:#fed7aa; color:#9a3412; background:#fff7ed; }
  .action-btn.unpublished:hover { border-color:#fb923c; }
  .action-btn.danger:hover   { border-color:#fca5a5; color:#dc2626; background:#fef2f2; }

  /* インライン編集 */
  .inline-edit { display:none; padding:16px 20px 20px; border-top:1px solid var(--border); background:#fafafa; }
  .inline-edit-label { font-size:.74rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:12px; }
  .inline-edit-field { margin-bottom:12px; }
  .inline-edit-field label { display:block; font-size:.78rem; font-weight:600; color:var(--primary-light); margin-bottom:5px; }
  .inline-edit-input, .inline-edit-textarea { width:100%; border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:9px 13px; font-size:.88rem; font-family:inherit; outline:none; background:var(--surface); transition:border-color .15s; color:var(--text); }
  .inline-edit-input:focus, .inline-edit-textarea:focus { border-color:var(--accent); }
  .inline-edit-textarea { min-height:90px; resize:vertical; }
  .inline-edit-actions { display:flex; gap:8px; justify-content:flex-end; }
  .ie-cancel { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:7px 16px; font-size:.82rem; color:var(--text-muted); cursor:pointer; font-weight:600; }
  .ie-cancel:hover { background:#f4f4f5; }
  .ie-save   { background:var(--primary); color:#fff; border:none; border-radius:var(--radius-sm); padding:7px 18px; font-size:.82rem; font-weight:700; cursor:pointer; transition:background .15s; }
  .ie-save:hover    { background:#3f3f46; }
  .ie-save:disabled { background:#a1a1aa; cursor:default; }

  /* spinner */
  .sp { width:12px; height:12px; border:2px solid currentColor; border-top-color:transparent; border-radius:50%; animation:spin .6s linear infinite; flex-shrink:0; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* empty / error */
  .admin-empty { text-align:center; padding:48px 20px; color:var(--text-muted); font-size:.88rem; }
  .admin-empty .ei { font-size:2rem; margin-bottom:10px; opacity:.35; }
  .admin-error { background:#fef2f2; border:1px solid #fecaca; border-radius:var(--radius-sm); padding:14px 18px; font-size:.86rem; color:#991b1b; margin-bottom:20px; display:none; }
  .admin-error.show { display:block; }

  /* toast */
  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--primary); color:#fff; padding:10px 22px; border-radius:999px; font-size:.84rem; font-weight:700; z-index:300; white-space:nowrap; box-shadow:0 4px 20px rgba(0,0,0,.18); opacity:0; pointer-events:none; transition:opacity .25s; }
  #toast.show { opacity:1; }

  @media (max-width:520px) {
    .login-card { padding:28px 20px; }
    .status-buttons { gap:5px; }
    .status-opt { padding:7px 11px; font-size:.8rem; }
    .pc-header { padding:13px 14px; }
  }
</style>
</head>
<body>

<!-- ログイン画面 -->
<div id="login-section">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">🏠</div>
      <div>
        <div class="login-logo-text">Shimokita College</div>
        <div class="login-logo-sub">全体会議ポータル</div>
      </div>
    </div>
    <div class="login-title">管理者ログイン</div>
    <div class="login-sub">議案のステータスを管理できます。</div>
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" id="email" placeholder="admin@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>パスワード</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="login-btn">ログイン</button>
    </form>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- 管理パネル -->
<div id="admin-section">
  <div class="admin-topbar">
    <div class="admin-topbar-inner">
      <div class="admin-logo">
        <div class="admin-logo-icon">🏠</div>
        Shimokita College
        <span class="admin-badge">管理者</span>
      </div>
      <div class="topbar-right">
        <span class="user-email" id="user-email"></span>
        <button class="logout-btn" onclick="handleLogout()">ログアウト</button>
      </div>
    </div>
  </div>

  <div class="admin-main">
    <a href="index.html" class="back-link">← ポータルに戻る</a>
    <div class="page-title">議案ステータス管理</div>
    <div class="page-sub">議案をクリックすると詳細・編集が展開されます。</div>
    <div class="admin-error" id="admin-error"></div>

    <!-- 新規作成 -->
    <div class="create-section">
      <div class="create-toggle" onclick="toggleCreate()">
        <span class="create-toggle-label">＋ 新しい議案を作成する</span>
        <span class="create-chevron" id="create-chevron">▼</span>
      </div>
      <div class="create-body" id="create-body">
        <div class="create-row">
          <label>タイトル</label>
          <input class="create-input" type="text" id="new-title" placeholder="議案タイトル">
        </div>
        <div class="create-row">
          <label>内容・背景</label>
          <textarea class="create-textarea" id="new-desc" placeholder="提案の詳細や背景を入力してください。"></textarea>
        </div>
        <div class="create-footer">
          <button class="create-btn" id="create-btn" onclick="createProposal()">作成する</button>
          <span class="create-fb" id="create-fb"></span>
        </div>
      </div>
    </div>

    <div id="proposals-container">
      <div class="admin-loading">読み込み中…</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const SUPABASE_URL  = 'https://ggdjoxnjwqthhkwpcvqq.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdnZGpveG5qd3F0aGhrd3BjdnFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNTYyNjIsImV4cCI6MjA5MzczMjI2Mn0.X1AvGI5I8I94siB6MS1B_ou9TlA5864wUNsuy6SK4bc';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const STATUSES = [
  { key:'提案中',      desc:'居住者セクションに表示' },
  { key:'取り上げ確定', desc:'採択予定バッジ付き' },
  { key:'議論中',      desc:'進行中セクションに移動' },
  { key:'決議済み',    desc:'アーカイブに移動' },
];
const BADGE_CFG = {
  '提案中':'status-pending', '取り上げ確定':'status-adopted',
  '議論中':'status-active',  '決議済み':'status-resolved',
};

// ─── 認証 ───
async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (session) showAdmin(session.user);
  db.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN'  && session) showAdmin(session.user);
    if (event === 'SIGNED_OUT')            showLogin();
  });
}
function showLogin() {
  document.getElementById('login-section').style.display = 'flex';
  document.getElementById('admin-section').style.display = 'none';
}
function showAdmin(user) {
  document.getElementById('login-section').style.display = 'none';
  document.getElementById('admin-section').style.display = 'block';
  document.getElementById('user-email').textContent = user?.email || '';
  fetchProposals();
}
async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  btn.disabled = true; btn.textContent = 'ログイン中…'; err.classList.remove('show');
  const { error } = await db.auth.signInWithPassword({
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
  });
  if (error) {
    err.textContent = 'ログインに失敗しました。'; err.classList.add('show');
    btn.disabled = false; btn.textContent = 'ログイン';
  }
}
async function handleLogout() { await db.auth.signOut(); }

// ─── データ取得 ───
async function fetchProposals() {
  const container = document.getElementById('proposals-container');
  container.innerHTML = '<div class="admin-loading">読み込み中…</div>';
  const { data, error } = await db.from('proposals').select('*')
    .order('sort_order', { ascending: true }).order('created_at', { ascending: true });
  if (error) {
    document.getElementById('admin-error').textContent = 'データの取得に失敗しました: ' + error.message;
    document.getElementById('admin-error').classList.add('show');
    container.innerHTML = ''; return;
  }
  container.innerHTML = '';
  if (!data || data.length === 0) {
    container.innerHTML = '<div class="admin-empty"><div class="ei">📋</div>議案がまだ登録されていません。</div>';
    return;
  }
  const list = document.createElement('div');
  list.className = 'proposals-list';
  data.forEach(p => list.appendChild(buildCard(p)));
  container.appendChild(list);
}

// ─── カード生成 ───
function buildCard(p) {
  const wrap = document.createElement('div');
  wrap.className = 'proposal-card';
  wrap.dataset.id = p.id;

  const badgeCls   = BADGE_CFG[p.status] || 'status-pending';
  const dateStr    = p.created_at
    ? new Date(p.created_at).toLocaleDateString('ja-JP', { year:'numeric', month:'long', day:'numeric' })
    : '';
  const isPublished = p.is_published !== false;

  const statusBtns = STATUSES.map(s => `
    <button class="status-opt s-${s.key} ${s.key===p.status?'selected':''}"
      data-key="${s.key}" title="${s.desc}"
      onclick="changeStatus('${p.id}','${s.key}',this)">
      <span class="sdot sdot-${s.key}"></span>${escHtml(s.key)}
    </button>`).join('');

  wrap.innerHTML = `
    <!-- ヘッダー：クリックで開閉 -->
    <div class="pc-header" onclick="toggleCard(this.parentElement)">
      <div class="pc-header-main">
        <div class="pc-title-row">
          <div class="pc-title">${escHtml(p.title)}</div>
          <span class="pc-badge ${badgeCls}" id="badge-${p.id}">${p.status}</span>
        </div>
        ${dateStr ? `<div class="pc-date">📅 ${dateStr}</div>` : ''}
      </div>
      <div class="pc-chevron">▼</div>
    </div>

    <!-- ボディ：折りたたみ -->
    <div class="pc-body">

      ${p.description ? `
      <div class="pc-preview">
        <div class="pc-preview-label">提案内容</div>
        <div>${escHtml(p.description).replace(/\n/g,'<br>')}</div>
      </div>` : ''}

      ${p.summary ? `
      <div class="pc-preview" style="border-top:1px solid var(--border)">
        <div class="pc-preview-label">✨ 要約</div>
        <div>${escHtml(p.summary).replace(/\n/g,'<br>')}</div>
      </div>` : ''}

      <!-- ステータス変更 -->
      <div class="status-changer">
        <div class="status-changer-label">ステータスを変更</div>
        <div class="status-buttons">${statusBtns}</div>
        <div class="status-fb" id="sfb-${p.id}"></div>
      </div>

      <!-- 議事録・要約エディタ -->
      <div class="minutes-editor">
        <div class="minutes-editor-label">📋 議事録・要約を編集</div>
        <div class="minutes-field">
          <div class="minutes-field-label">議事録（本文）</div>
          <textarea class="minutes-textarea body" id="mbody-${p.id}"
            placeholder="会議での議論内容や決定事項…">${escHtml(p.minutes||'')}</textarea>
        </div>
        <div class="minutes-field">
          <div class="minutes-field-label">要約（ポータルのポップアップに表示）</div>
          <textarea class="minutes-textarea summary" id="msum-${p.id}"
            placeholder="3〜5行程度の要約…">${escHtml(p.summary||'')}</textarea>
        </div>
        <div class="minutes-field">
          <div class="minutes-field-label">Google ドキュメント URL（任意）</div>
          <input type="url" class="minutes-textarea" style="min-height:unset;resize:none;height:auto;padding:9px 13px;"
            id="mgdoc-${p.id}" placeholder="https://docs.google.com/document/d/..."
            value="${escHtml(p.gdoc_url||'')}">
        </div>
        <div class="minutes-save-row">
          <button class="minutes-save-btn" id="msbtn-${p.id}" onclick="saveMinutes('${p.id}')">保存する</button>
          <div class="minutes-save-fb" id="msfb-${p.id}"></div>
        </div>
      </div>

      <!-- アクション -->
      <div class="pc-actions">
        <div class="actions-left">
          <button class="action-btn ${isPublished?'published':'unpublished'}"
            id="pub-${p.id}" onclick="togglePublish('${p.id}',this)">
            ${isPublished?'👁 公開中':'🚫 非公開'}
          </button>
        </div>
        <div class="actions-right">
          <button class="action-btn" onclick="startEdit('${p.id}')">✏️ 編集</button>
          <button class="action-btn danger" onclick="deleteProposal('${p.id}')">🗑️ 削除</button>
        </div>
      </div>

      <!-- インライン編集フォーム -->
      <div class="inline-edit" id="iedit-${p.id}">
        <div class="inline-edit-label">✏️ 議案を編集</div>
        <div class="inline-edit-field">
          <label>タイトル</label>
          <input type="text" class="inline-edit-input" id="ietitle-${p.id}" value="${escHtml(p.title)}">
        </div>
        <div class="inline-edit-field">
          <label>内容・背景</label>
          <textarea class="inline-edit-textarea" id="iedesc-${p.id}">${escHtml(p.description||'')}</textarea>
        </div>
        <div class="inline-edit-actions">
          <button class="ie-cancel" onclick="cancelEdit('${p.id}')">キャンセル</button>
          <button class="ie-save" id="iesave-${p.id}" onclick="saveEdit('${p.id}')">変更を保存</button>
        </div>
      </div>

    </div>`;
  return wrap;
}

// ─── アコーディオン ───
function toggleCard(card) {
  card.classList.toggle('open');
}

// ─── ステータス更新 ───
async function changeStatus(id, newStatus, btn) {
  const card  = document.querySelector(`.proposal-card[data-id="${id}"]`);
  const fb    = document.getElementById(`sfb-${id}`);
  const badge = document.getElementById(`badge-${id}`);
  const btns  = card.querySelectorAll('.status-opt');
  if (btn.classList.contains('selected')) return;
  btns.forEach(b => { b.classList.remove('selected'); b.disabled = true; });
  btn.classList.add('selected');
  badge.className = `pc-badge ${BADGE_CFG[newStatus]||'status-pending'}`;
  badge.textContent = newStatus;
  fb.innerHTML = '<span class="sp"></span> 保存中…'; fb.className = 'status-fb saving';
  const { error } = await db.from('proposals')
    .update({ status: newStatus, updated_at: new Date().toISOString() }).eq('id', id);
  btns.forEach(b => b.disabled = false);
  if (error) {
    fb.innerHTML = '❌ 保存に失敗しました'; fb.className = 'status-fb error';
  } else {
    fb.innerHTML = '✅ 保存しました'; fb.className = 'status-fb success';
    setTimeout(() => { fb.innerHTML=''; fb.className='status-fb'; }, 2500);
    showToast(`「${newStatus}」に変更しました`);
  }
}

// ─── 議事録保存 ───
async function saveMinutes(id) {
  const btn = document.getElementById(`msbtn-${id}`);
  const fb  = document.getElementById(`msfb-${id}`);
  btn.disabled = true;
  fb.innerHTML = '<span class="sp"></span> 保存中…'; fb.className = 'minutes-save-fb saving';
  const { error } = await db.from('proposals').update({
    minutes:    document.getElementById(`mbody-${id}`).value,
    summary:    document.getElementById(`msum-${id}`).value,
    gdoc_url:   document.getElementById(`mgdoc-${id}`).value.trim(),
    updated_at: new Date().toISOString(),
  }).eq('id', id);
  btn.disabled = false;
  if (error) {
    fb.innerHTML = '❌ 失敗しました'; fb.className = 'minutes-save-fb error';
  } else {
    fb.innerHTML = '✅ 保存しました'; fb.className = 'minutes-save-fb success';
    setTimeout(() => { fb.innerHTML=''; fb.className='minutes-save-fb'; }, 3000);
    showToast('議事録を保存しました');
  }
}

// ─── 公開・非公開 ───
async function togglePublish(id, btn) {
  const nowPublished = btn.classList.contains('published');
  const next = !nowPublished;
  btn.disabled = true;
  const { error } = await db.from('proposals')
    .update({ is_published: next, updated_at: new Date().toISOString() }).eq('id', id);
  btn.disabled = false;
  if (error) { showToast('更新に失敗しました。'); return; }
  btn.className  = `action-btn ${next ? 'published' : 'unpublished'}`;
  btn.textContent = next ? '👁 公開中' : '🚫 非公開';
  showToast(next ? '議案を公開しました' : '議案を非公開にしました');
}

// ─── 削除 ───
async function deleteProposal(id) {
  const card  = document.querySelector(`.proposal-card[data-id="${id}"]`);
  const title = card?.querySelector('.pc-title')?.textContent || 'この議案';
  if (!confirm(`「${title}」を削除しますか？\nこの操作は元に戻せません。`)) return;
  const { error } = await db.from('proposals').delete().eq('id', id);
  if (error) { showToast('削除に失敗しました: ' + error.message); return; }
  card?.remove();
  showToast('削除しました');
}

// ─── インライン編集 ───
function startEdit(id) {
  document.getElementById(`iedit-${id}`).style.display = 'block';
}
function cancelEdit(id) {
  document.getElementById(`iedit-${id}`).style.display = 'none';
}
async function saveEdit(id) {
  const titleEl = document.getElementById(`ietitle-${id}`);
  const descEl  = document.getElementById(`iedesc-${id}`);
  const saveBtn = document.getElementById(`iesave-${id}`);
  const newTitle = titleEl.value.trim();
  if (!newTitle) { titleEl.focus(); return; }
  saveBtn.disabled = true; saveBtn.textContent = '保存中…';
  const { error } = await db.from('proposals')
    .update({ title: newTitle, description: descEl.value.trim(), updated_at: new Date().toISOString() })
    .eq('id', id);
  saveBtn.disabled = false; saveBtn.textContent = '変更を保存';
  if (error) { showToast('編集に失敗しました。'); return; }
  const card = document.querySelector(`.proposal-card[data-id="${id}"]`);
  if (card) card.querySelector('.pc-title').textContent = newTitle;
  document.getElementById(`iedit-${id}`).style.display = 'none';
  showToast('変更を保存しました');
}

// ─── 新規作成 ───
function toggleCreate() {
  const body    = document.getElementById('create-body');
  const chevron = document.getElementById('create-chevron');
  const open    = body.classList.toggle('open');
  chevron.classList.toggle('open', open);
}
async function createProposal() {
  const titleEl = document.getElementById('new-title');
  const descEl  = document.getElementById('new-desc');
  const btn     = document.getElementById('create-btn');
  const fb      = document.getElementById('create-fb');
  const title   = titleEl.value.trim();
  if (!title) { titleEl.focus(); return; }
  btn.disabled = true; btn.textContent = '作成中…'; fb.className = 'create-fb';
  const itemId = typeof crypto.randomUUID==='function'
    ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2);
  const { error } = await db.from('proposals').insert({
    item_id: itemId, title, description: descEl.value.trim(),
    status: '提案中', is_published: true,
  });
  btn.disabled = false; btn.textContent = '作成する';
  if (error) {
    fb.textContent = '❌ 作成に失敗しました: ' + error.message; fb.className = 'create-fb err';
    return;
  }
  fb.textContent = '✅ 作成しました'; fb.className = 'create-fb ok';
  titleEl.value = ''; descEl.value = '';
  setTimeout(() => { fb.textContent=''; fb.className='create-fb'; }, 3000);
  fetchProposals();
}

// ─── ユーティリティ ───
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2800);
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
</body>
</html>
