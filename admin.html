<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理 | 全体会議ポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --ink:   #2b2722;
    --ink-2: #4a443c;
    --mute:  #7b7367;
    --faint: #aaa194;
    --line:  #ddd4c4;
    --line-2:#ebe4d6;
    --tint:  #efe8d9;
    --paper: #f8f4eb;
    --white: #fffdf8;
    --moss:  #4d6b53; --moss-bg:  #e2e9dc; --moss-line:  #b9cab5;
    --ochre: #94702a; --ochre-bg: #f2e7cc; --ochre-line: #dcc68f;
    --slate: #4c6179; --slate-bg: #e0e6ec; --slate-line: #b7c3d0;
    --clay:  #a0553f;
    --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Segoe UI', sans-serif;
    --serif: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans); font-size: 16px; line-height: 1.7; letter-spacing: .01em;
    color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: none; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 24px; }

  /* 共通部品 */
  .field {
    width: 100%; border: none; border-bottom: 1px solid var(--line); border-radius: 0;
    padding: 8px 0; font-size: 14px; background: transparent; outline: none; transition: border-color .15s;
  }
  .field:focus { border-color: var(--ink); }
  textarea.field { resize: vertical; line-height: 1.85; }
  .label { display: block; font-size: 11px; letter-spacing: 0; color: var(--mute); margin-bottom: 2px; }
  .btn {
    font-size: 13px; font-weight: 500; letter-spacing: 0; padding: 8px 18px;
    border: 1px solid var(--ink); background: var(--ink); color: var(--white);
    transition: background .15s, color .15s; white-space: nowrap;
  }
  .btn:hover { background: var(--paper); color: var(--ink); }
  .btn:disabled { background: var(--line); border-color: var(--line); color: var(--white); cursor: default; }
  .btn.ghost { background: var(--paper); color: var(--ink); }
  .btn.ghost:hover { background: var(--ink); color: var(--white); }
  .link { font-size: 12px; color: var(--mute); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
  .link:hover { color: var(--ink); text-decoration-color: var(--ink); }
  .link.danger:hover { color: var(--clay); text-decoration-color: var(--clay); }
  .fb { font-size: 12px; color: var(--mute); min-height: 18px; }
  .fb.err { color: var(--clay); font-weight: 700; }

  /* ─── ログイン ─── */
  #login-section { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login { width: 100%; max-width: 360px; }
  .login .org { font-size: 12px; letter-spacing: 0; color: var(--mute); text-transform: uppercase; padding-bottom: 12px; border-bottom: 1px solid var(--ink); }
  .login h1 { font-family: var(--serif); font-size: 28px; font-weight: 700; letter-spacing: -.01em; margin: 22px 0 4px; }
  .login p { font-size: 13px; color: var(--mute); margin-bottom: 28px; }
  .login .row { margin-bottom: 18px; }
  .login .btn { width: 100%; padding: 11px; margin-top: 8px; }
  .login-error { display: none; margin-top: 16px; font-size: 13px; padding: 10px 14px; background: var(--tint); border-left: 2px solid var(--ink); }
  .login-error.show { display: block; }
  .login .back { display: inline-block; margin-top: 24px; }

  /* ─── 管理画面 ─── */
  #admin-section { display: none; }
  .bar { border-bottom: 1px solid var(--ink); position: sticky; top: 0; background: var(--paper); z-index: 50; }
  .bar .wrap { display: flex; align-items: center; justify-content: space-between; height: 56px; gap: 16px; }
  .bar .brand { font-size: 13px; font-weight: 700; letter-spacing: 0; }
  .bar .brand span { font-weight: 400; color: var(--mute); margin-left: 10px; }
  .bar .right { display: flex; align-items: center; gap: 18px; font-size: 12px; color: var(--mute); }

  .head { padding: 40px 0 0; }
  .head h1 { font-family: var(--serif); font-size: 32px; font-weight: 700; letter-spacing: -.01em; }
  .head p { font-size: 13px; color: var(--mute); margin-top: 4px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 28px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stat { padding: 14px 16px; border-right: 1px solid var(--line); }
  .stat:first-child { padding-left: 0; }
  .stat:last-child { border-right: none; }
  .stat .k { font-size: 11px; letter-spacing: 0; color: var(--mute); }
  .stat .v { font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.4; }

  .admin-error { display: none; margin-top: 20px; font-size: 13px; padding: 10px 14px; background: var(--tint); border-left: 2px solid var(--ink); }
  .admin-error.show { display: block; }

  /* 新規作成 */
  .create { margin-top: 36px; border: 1px solid var(--ink); }
  .create-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; text-align: left; }
  .create-toggle span { font-size: 14px; font-weight: 700; letter-spacing: 0; }
  .create-body { display: none; padding: 4px 20px 20px; border-top: 1px solid var(--line); }
  .create.open .create-body { display: block; }
  .create-body .f { margin-top: 16px; }
  .create-foot { display: flex; align-items: center; gap: 14px; margin-top: 20px; }

  .toggle { width: 22px; height: 22px; position: relative; flex-shrink: 0; }
  .toggle::before, .toggle::after { content: ''; position: absolute; left: 4px; right: 4px; top: 10px; height: 1.5px; background: var(--ink); transition: transform .2s; }
  .toggle::after { transform: rotate(90deg); }
  .create.open .toggle::after, .proposal-card.open .pc-header .toggle::after { transform: rotate(0deg); }

  /* 議案リスト */
  .list-head { display: flex; align-items: baseline; gap: 14px; margin-top: 48px; padding-bottom: 12px; border-bottom: 2px solid var(--ink); }
  .list-head h2 { font-family: var(--serif); font-size: 22px; font-weight: 700; letter-spacing: -.005em; }
  .list-head span { margin-left: auto; font-size: 12px; color: var(--mute); }
  .proposals-list { counter-reset: item; }
  .proposal-card { border-bottom: 1px solid var(--line); counter-increment: item; scroll-margin-top: 64px; }
  .pc-header { display: grid; grid-template-columns: 44px 1fr auto; gap: 0 16px; align-items: start; padding: 20px 0; cursor: pointer; user-select: none; }
  .pc-header:hover .pc-title { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
  .idx { font-size: 13px; color: var(--faint); padding-top: 3px; font-variant-numeric: tabular-nums; }
  .idx::before { content: counter(item, decimal-leading-zero); }
  .pc-title { font-size: 17px; font-weight: 600; line-height: 1.5; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 8px; font-size: 12px; color: var(--mute); }
  .meta time { font-variant-numeric: tabular-nums; }
  .status { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0; padding: 2px 8px; line-height: 1.6; border: 1px solid var(--ink); }
  .s-active   { background: var(--moss); border-color: var(--moss); color: var(--white); }
  .s-adopted  { background: var(--ochre-bg); border-color: var(--ochre-line); color: var(--ochre); }
  .s-pending  { border-color: var(--line); color: var(--mute); }
  .s-resolved { background: var(--slate-bg); border-color: var(--slate-line); color: var(--slate); }
  .hidden-tag { font-size: 11px; letter-spacing: 0; color: var(--clay); border: 1px dashed var(--clay); padding: 1px 7px; }

  .pc-body { display: none; padding: 0 0 28px 60px; }
  .proposal-card.open .pc-body { display: block; }
  .block { padding: 20px 0; border-top: 1px solid var(--line-2); }
  .block:first-child { border-top: none; padding-top: 0; }
  .block-title { font-size: 11px; letter-spacing: 0; color: var(--mute); margin-bottom: 10px; }
  .prose { font-size: 14px; line-height: 1.9; color: var(--ink-2); white-space: pre-wrap; word-break: break-word; }
  .prose.empty { color: var(--faint); }

  /* ステータス切替（区切られた選択肢） */
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--ink); }
  .seg button { padding: 10px 8px; font-size: 13px; border-right: 1px solid var(--ink); transition: background .15s, color .15s; }
  .seg button:last-child { border-right: none; }
  .seg button:hover { background: var(--tint); }
  .seg button.selected { background: var(--ink); color: var(--white); font-weight: 700; }
  .seg button.selected[data-key="提案中"]      { background: var(--mute); }
  .seg button.selected[data-key="取り上げ確定"] { background: var(--ochre); }
  .seg button.selected[data-key="議論中"]      { background: var(--moss); }
  .seg button.selected[data-key="決議済み"]    { background: var(--slate); }
  .seg button:disabled { cursor: default; }
  .seg-note { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 12px; color: var(--faint); }

  .fields { display: grid; gap: 18px; }
  .save-row { display: flex; align-items: center; gap: 14px; margin-top: 18px; }

  .actions { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .pub { display: flex; align-items: center; gap: 12px; font-size: 13px; }
  .switch { width: 40px; height: 22px; border: 1px solid var(--ink); position: relative; transition: background .15s; flex-shrink: 0; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; background: var(--ink); transition: transform .15s, background .15s; }
  .switch.on { background: var(--moss); border-color: var(--moss); }
  .switch.on::after { transform: translateX(18px); background: var(--paper); }
  .actions .right { display: flex; gap: 18px; }

  .inline-edit { display: none; margin-top: 18px; padding: 20px; background: var(--tint); }
  .inline-edit .f + .f { margin-top: 16px; }
  .inline-edit .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

  .sp { display: inline-block; width: 10px; height: 10px; border: 1.5px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: -1px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .state { padding: 28px 0; font-size: 13px; color: var(--faint); }

  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 8px);
    background: var(--ink); color: var(--white); font-size: 13px; padding: 10px 20px;
    z-index: 300; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 640px) {
    .wrap { padding: 0 16px; }
    .bar .brand span, #user-email { display: none; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .stat:nth-child(2) { border-right: none; }
    .stat:nth-child(3) { padding-left: 0; }
    .stat:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
    .pc-header { grid-template-columns: 30px 1fr auto; }
    .pc-body { padding-left: 0; }
    .seg { grid-template-columns: repeat(2, 1fr); }
    .seg button:nth-child(2) { border-right: none; }
    .seg button:nth-child(-n+2) { border-bottom: 1px solid var(--ink); }
  }
</style>
</head>
<body>

<div id="login-section">
  <div class="login">
    <div class="org">Shimokita College</div>
    <h1>管理者ログイン</h1>
    <p>議案の作成・状態変更・議事録の入力を行います。</p>
    <form onsubmit="handleLogin(event)">
      <div class="row">
        <label class="label" for="email">メールアドレス</label>
        <input class="field" type="email" id="email" required autocomplete="email">
      </div>
      <div class="row">
        <label class="label" for="password">パスワード</label>
        <input class="field" type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="login-btn">ログイン</button>
    </form>
    <div class="login-error" id="login-error"></div>
    <a href="index.html" class="link back">ポータルに戻る</a>
  </div>
</div>

<div id="admin-section">
  <div class="bar">
    <div class="wrap">
      <div class="brand">全体会議ポータル<span>管理</span></div>
      <div class="right">
        <a href="index.html" class="link">ポータルを見る</a>
        <span id="user-email"></span>
        <button class="link" onclick="handleLogout()">ログアウト</button>
      </div>
    </div>
  </div>

  <main class="wrap">
    <div class="head">
      <h1>議案の管理</h1>
      <p>議案を選ぶと、状態の変更・議事録の入力・公開設定ができます。変更はポータルに即時反映されます。</p>
      <div class="stats">
        <div class="stat"><div class="k">検討中</div><div class="v" id="st-提案中">-</div></div>
        <div class="stat"><div class="k">採択予定</div><div class="v" id="st-取り上げ確定">-</div></div>
        <div class="stat"><div class="k">審議中</div><div class="v" id="st-議論中">-</div></div>
        <div class="stat"><div class="k">決議済み</div><div class="v" id="st-決議済み">-</div></div>
      </div>
    </div>

    <div class="admin-error" id="admin-error"></div>

    <div class="create" id="create">
      <button class="create-toggle" onclick="toggleCreate()" aria-expanded="false" id="create-toggle">
        <span>新しい議案を作成</span><span class="toggle" aria-hidden="true"></span>
      </button>
      <div class="create-body">
        <div class="f">
          <label class="label" for="new-title">タイトル</label>
          <input class="field" type="text" id="new-title">
        </div>
        <div class="f">
          <label class="label" for="new-desc">内容・背景</label>
          <textarea class="field" id="new-desc" rows="4"></textarea>
        </div>
        <div class="create-foot">
          <button class="btn" id="create-btn" onclick="createProposal()">作成する</button>
          <span class="fb" id="create-fb"></span>
        </div>
      </div>
    </div>

    <div class="list-head"><h2>議案一覧</h2><span id="list-count"></span></div>
    <div id="proposals-container"><div class="state">読み込み中</div></div>
  </main>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
const SUPABASE_URL  = 'https://ggdjoxnjwqthhkwpcvqq.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdnZGpveG5qd3F0aGhrd3BjdnFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNTYyNjIsImV4cCI6MjA5MzczMjI2Mn0.X1AvGI5I8I94siB6MS1B_ou9TlA5864wUNsuy6SK4bc';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const STATUSES = [
  { key:'提案中',      label:'検討中',   cls:'s-pending',  desc:'提案セクションに表示' },
  { key:'取り上げ確定', label:'採択予定', cls:'s-adopted',  desc:'提案セクションに「次回の議題に採用」付きで表示' },
  { key:'議論中',      label:'審議中',   cls:'s-active',   desc:'審議中セクションに移動、議事録ボタン表示' },
  { key:'決議済み',    label:'決議済み', cls:'s-resolved', desc:'過去の議案に移動' },
];
const STATUS_BY_KEY = Object.fromEntries(STATUSES.map(s => [s.key, s]));

// ─── 認証 ───
async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (session) showAdmin(session.user);
  db.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session) showAdmin(session.user);
    if (event === 'SIGNED_OUT') showLogin();
  });
}
function showLogin() {
  document.getElementById('login-section').style.display = 'flex';
  document.getElementById('admin-section').style.display = 'none';
}
let adminShown = false;
function showAdmin(user) {
  document.getElementById('login-section').style.display = 'none';
  document.getElementById('admin-section').style.display = 'block';
  document.getElementById('user-email').textContent = user?.email || '';
  if (!adminShown) { adminShown = true; fetchProposals(); }
}
async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  btn.disabled = true; btn.textContent = 'ログイン中'; err.classList.remove('show');
  const { error } = await db.auth.signInWithPassword({
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
  });
  if (error) {
    err.textContent = 'ログインに失敗しました。メールアドレスとパスワードを確認してください。';
    err.classList.add('show');
    btn.disabled = false; btn.textContent = 'ログイン';
  }
}
async function handleLogout() { adminShown = false; await db.auth.signOut(); }

// ─── データ取得 ───
async function fetchProposals() {
  const container = document.getElementById('proposals-container');
  container.innerHTML = '<div class="state">読み込み中</div>';
  const { data, error } = await db.from('proposals').select('*')
    .order('sort_order', { ascending: true }).order('created_at', { ascending: true });
  if (error) {
    const el = document.getElementById('admin-error');
    el.textContent = 'データの取得に失敗しました：' + error.message;
    el.classList.add('show');
    container.innerHTML = '';
    return;
  }
  container.innerHTML = '';
  if (!data || data.length === 0) {
    container.innerHTML = '<div class="state">議案はまだ登録されていません。</div>';
  } else {
    const list = document.createElement('div');
    list.className = 'proposals-list';
    data.forEach(p => list.appendChild(buildCard(p)));
    container.appendChild(list);
  }
  updateStats();
}

function updateStats() {
  const cards = [...document.querySelectorAll('.proposal-card')];
  STATUSES.forEach(s => {
    document.getElementById(`st-${s.key}`).textContent = cards.filter(c => c.dataset.status === s.key).length;
  });
  document.getElementById('list-count').textContent = `${cards.length}件`;
}

// ─── 議案の行 ───
function buildCard(p) {
  const wrap = document.createElement('article');
  wrap.className = 'proposal-card';
  wrap.dataset.id = p.id;
  wrap.dataset.status = p.status;
  const st = STATUS_BY_KEY[p.status] || STATUSES[0];
  const isPublished = p.is_published !== false;
  const desc = (p.description || '').trim();
  const summary = (p.summary || '').trim();

  const segBtns = STATUSES.map(s => `
    <button class="${s.key === p.status ? 'selected' : ''}" data-key="${s.key}" title="${s.desc}"
      onclick="changeStatus('${p.id}','${s.key}',this)">${s.label}</button>`).join('');

  wrap.innerHTML = `
    <div class="pc-header" role="button" tabindex="0" aria-expanded="false"
         onclick="toggleCard(this.parentElement)" onkeydown="rowKey(event,this.parentElement)">
      <span class="idx"></span>
      <div>
        <h3 class="pc-title">${escHtml(p.title)}</h3>
        <div class="meta">
          <span class="status ${st.cls}" id="badge-${p.id}">${st.label}</span>
          <span class="hidden-tag" id="htag-${p.id}" style="${isPublished ? 'display:none' : ''}">非公開</span>
          ${p.created_at ? `<time>${fmtDate(p.created_at)}</time>` : ''}
        </div>
      </div>
      <span class="toggle" aria-hidden="true"></span>
    </div>

    <div class="pc-body">
      <div class="block">
        <div class="block-title">提案内容</div>
        <div class="prose${desc ? '' : ' empty'}" id="pdesc-${p.id}">${desc ? escHtml(desc) : '記載なし'}</div>
      </div>

      <div class="block">
        <div class="block-title">要約</div>
        <div class="prose${summary ? '' : ' empty'}" id="psum-${p.id}">${summary ? escHtml(summary) : 'まだ入力されていません'}</div>
      </div>

      <div class="block">
        <div class="block-title">状態</div>
        <div class="seg" id="seg-${p.id}">${segBtns}</div>
        <div class="seg-note"><span id="sdesc-${p.id}">${st.desc}</span><span class="fb" id="sfb-${p.id}"></span></div>
      </div>

      <div class="block">
        <div class="block-title">議事録</div>
        <div class="fields">
          <div>
            <label class="label" for="mbody-${p.id}">議事録（本文）</label>
            <textarea class="field" id="mbody-${p.id}" rows="6" placeholder="会議での議論の経過や決定事項">${escHtml(p.minutes || '')}</textarea>
          </div>
          <div>
            <label class="label" for="msum-${p.id}">要約（ポータルの議事録画面に表示）</label>
            <textarea class="field" id="msum-${p.id}" rows="3" placeholder="3〜5行程度のまとめ">${escHtml(summary)}</textarea>
          </div>
          <div>
            <label class="label" for="mgdoc-${p.id}">Google ドキュメントの URL（任意）</label>
            <input class="field" type="url" id="mgdoc-${p.id}" placeholder="https://docs.google.com/document/d/..." value="${escHtml(p.gdoc_url || '')}">
          </div>
        </div>
        <div class="save-row">
          <button class="btn" id="msbtn-${p.id}" onclick="saveMinutes('${p.id}')">議事録を保存</button>
          <span class="fb" id="msfb-${p.id}"></span>
        </div>
      </div>

      <div class="block">
        <div class="actions">
          <div class="pub">
            <button class="switch ${isPublished ? 'on' : ''}" id="pub-${p.id}" role="switch" aria-checked="${isPublished}"
              aria-label="ポータルに公開" onclick="togglePublish('${p.id}',this)"></button>
            <span id="publabel-${p.id}">${isPublished ? 'ポータルに公開中' : '非公開（ポータルに表示されません）'}</span>
          </div>
          <div class="right">
            <button class="link" onclick="startEdit('${p.id}')">タイトル・内容を編集</button>
            <button class="link danger" onclick="deleteProposal('${p.id}')">削除</button>
          </div>
        </div>
        <div class="inline-edit" id="iedit-${p.id}">
          <div class="f">
            <label class="label" for="ietitle-${p.id}">タイトル</label>
            <input class="field" type="text" id="ietitle-${p.id}" value="${escHtml(p.title)}">
          </div>
          <div class="f">
            <label class="label" for="iedesc-${p.id}">内容・背景</label>
            <textarea class="field" id="iedesc-${p.id}" rows="4">${escHtml(p.description || '')}</textarea>
          </div>
          <div class="foot">
            <button class="btn ghost" onclick="cancelEdit('${p.id}')">キャンセル</button>
            <button class="btn" id="iesave-${p.id}" onclick="saveEdit('${p.id}')">変更を保存</button>
          </div>
        </div>
      </div>
    </div>`;
  return wrap;
}

function toggleCard(card) {
  const open = card.classList.toggle('open');
  card.querySelector('.pc-header').setAttribute('aria-expanded', open);
}
function rowKey(e, card) {
  if (e.target !== e.currentTarget) return;
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleCard(card); }
}
function setFb(el, html, cls = '') { el.innerHTML = html; el.className = 'fb' + (cls ? ' ' + cls : ''); }
function flashDone(el, msg) {
  setFb(el, msg);
  clearTimeout(el._t); el._t = setTimeout(() => setFb(el, ''), 2500);
}

// ─── 状態変更 ───
async function changeStatus(id, newStatus, btn) {
  if (btn.classList.contains('selected')) return;
  const card = document.querySelector(`.proposal-card[data-id="${id}"]`);
  const btns = card.querySelectorAll(`#seg-${id} button`);
  const prev = card.dataset.status;
  const fb = document.getElementById(`sfb-${id}`);
  const apply = key => {
    const s = STATUS_BY_KEY[key];
    btns.forEach(b => b.classList.toggle('selected', b.dataset.key === key));
    const badge = document.getElementById(`badge-${id}`);
    badge.className = `status ${s.cls}`; badge.textContent = s.label;
    document.getElementById(`sdesc-${id}`).textContent = s.desc;
    card.dataset.status = key;
    updateStats();
  };
  apply(newStatus);
  btns.forEach(b => b.disabled = true);
  setFb(fb, '<span class="sp"></span>保存中');
  const { error } = await db.from('proposals')
    .update({ status: newStatus, updated_at: new Date().toISOString() }).eq('id', id);
  btns.forEach(b => b.disabled = false);
  if (error) { apply(prev); setFb(fb, '保存に失敗しました', 'err'); return; }
  flashDone(fb, '保存しました');
  showToast(`「${STATUS_BY_KEY[newStatus].label}」に変更しました`);
}

// ─── 議事録 ───
async function saveMinutes(id) {
  const btn = document.getElementById(`msbtn-${id}`);
  const fb  = document.getElementById(`msfb-${id}`);
  const summary = document.getElementById(`msum-${id}`).value;
  btn.disabled = true;
  setFb(fb, '<span class="sp"></span>保存中');
  const { error } = await db.from('proposals').update({
    minutes:    document.getElementById(`mbody-${id}`).value,
    summary,
    gdoc_url:   document.getElementById(`mgdoc-${id}`).value.trim(),
    updated_at: new Date().toISOString(),
  }).eq('id', id);
  btn.disabled = false;
  if (error) { setFb(fb, '保存に失敗しました：' + escHtml(error.message), 'err'); return; }
  const sumEl = document.getElementById(`psum-${id}`);
  sumEl.className = 'prose' + (summary.trim() ? '' : ' empty');
  sumEl.textContent = summary.trim() || 'まだ入力されていません';
  flashDone(fb, '保存しました');
  showToast('議事録を保存しました');
}

// ─── 公開設定 ───
async function togglePublish(id, sw) {
  const next = !sw.classList.contains('on');
  sw.disabled = true;
  const { error } = await db.from('proposals')
    .update({ is_published: next, updated_at: new Date().toISOString() }).eq('id', id);
  sw.disabled = false;
  if (error) { showToast('公開設定の更新に失敗しました'); return; }
  sw.classList.toggle('on', next);
  sw.setAttribute('aria-checked', next);
  document.getElementById(`publabel-${id}`).textContent = next ? 'ポータルに公開中' : '非公開（ポータルに表示されません）';
  document.getElementById(`htag-${id}`).style.display = next ? 'none' : '';
  showToast(next ? '議案を公開しました' : '議案を非公開にしました');
}

// ─── 削除 ───
async function deleteProposal(id) {
  const card  = document.querySelector(`.proposal-card[data-id="${id}"]`);
  const title = card?.querySelector('.pc-title')?.textContent || 'この議案';
  if (!confirm(`「${title}」を削除しますか。\nこの操作は取り消せません。`)) return;
  const { error } = await db.from('proposals').delete().eq('id', id);
  if (error) { showToast('削除に失敗しました：' + error.message); return; }
  card?.remove();
  updateStats();
  showToast('削除しました');
}

// ─── タイトル・内容の編集 ───
function startEdit(id)  { document.getElementById(`iedit-${id}`).style.display = 'block'; document.getElementById(`ietitle-${id}`).focus(); }
function cancelEdit(id) { document.getElementById(`iedit-${id}`).style.display = 'none'; }
async function saveEdit(id) {
  const titleEl = document.getElementById(`ietitle-${id}`);
  const descEl  = document.getElementById(`iedesc-${id}`);
  const btn     = document.getElementById(`iesave-${id}`);
  const title = titleEl.value.trim();
  if (!title) { titleEl.focus(); return; }
  btn.disabled = true; btn.textContent = '保存中';
  const desc = descEl.value.trim();
  const { error } = await db.from('proposals')
    .update({ title, description: desc, updated_at: new Date().toISOString() }).eq('id', id);
  btn.disabled = false; btn.textContent = '変更を保存';
  if (error) { showToast('編集に失敗しました'); return; }
  const card = document.querySelector(`.proposal-card[data-id="${id}"]`);
  card.querySelector('.pc-title').textContent = title;
  const d = document.getElementById(`pdesc-${id}`);
  d.className = 'prose' + (desc ? '' : ' empty');
  d.textContent = desc || '記載なし';
  cancelEdit(id);
  showToast('変更を保存しました');
}

// ─── 新規作成 ───
function toggleCreate() {
  const box = document.getElementById('create');
  const open = box.classList.toggle('open');
  document.getElementById('create-toggle').setAttribute('aria-expanded', open);
  if (open) document.getElementById('new-title').focus();
}
async function createProposal() {
  const titleEl = document.getElementById('new-title');
  const descEl  = document.getElementById('new-desc');
  const btn = document.getElementById('create-btn');
  const fb  = document.getElementById('create-fb');
  const title = titleEl.value.trim();
  if (!title) { titleEl.focus(); setFb(fb, 'タイトルを入力してください', 'err'); return; }
  btn.disabled = true; btn.textContent = '作成中';
  const itemId = typeof crypto.randomUUID === 'function'
    ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
  const { error } = await db.from('proposals').insert({
    item_id: itemId, title, description: descEl.value.trim(), status: '提案中', is_published: true,
  });
  btn.disabled = false; btn.textContent = '作成する';
  if (error) { setFb(fb, '作成に失敗しました：' + escHtml(error.message), 'err'); return; }
  titleEl.value = ''; descEl.value = '';
  flashDone(fb, '作成しました');
  fetchProposals();
}

// ─── ユーティリティ ───
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2800);
}
function fmtDate(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
}
function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

init();
</script>
</body>
</html>
